[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "worktree-sheriff"
version = "0.1.0"
description = "Read-only Git worktree safety inventory for busy repositories"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
worktree-sheriff = "worktree_sheriff.cli:main"

[project.urls]
Homepage = "https://github.com/N-Combinator/worktree-sheriff"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
